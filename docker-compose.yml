services:
  newki-mcp:
    build:
      context: ..
      dockerfile: newki-mcp-docker/Dockerfile
    network_mode: host
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Set the SQL Server connection string}
      Database__Provider: ${Database__Provider:-PostgreSql}
      Database__RequireCognito: ${Database__RequireCognito:-false}
      Database__CognitoAuthority: ${Database__CognitoAuthority:-}
      Database__CognitoAudience: ${Database__CognitoAudience:-}
      Database__TenantColumn: ${Database__TenantColumn:-}
    restart: unless-stopped
